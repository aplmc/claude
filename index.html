<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0d0f12" />
<title>Home Inventory</title>
<style>
:root{
  --bg:#0d0f12; --surface:#16191e; --surface-2:#1d2128; --surface-3:#252a32;
  --line:#2a2f37; --line-soft:#22262d;
  --text:#e8eaed; --text-2:#a4abb5; --text-3:#6b727c;
  --accent:#d4af37; --accent-soft:#3a3320; --accent-text:#f0d98a;
  --blue:#5b9bd5; --red:#e07a6f; --green:#6cc08b; --amber:#e0a44a;
  --tap:46px; --radius:14px; --radius-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.45;overscroll-behavior-y:none;height:100%;}
body{-webkit-font-smoothing:antialiased;}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;font-size:16px;}
input,select,textarea{font-family:inherit;font-size:16px;}
input,textarea{color:var(--text);}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}

/* ---- Top bar ---- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(13,15,18,.86);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  padding:calc(var(--safe-t) + 12px) 16px 12px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:12px;}
.topbar h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em;flex:1;}
.topbar .crumb{font-size:13px;color:var(--text-3);font-weight:500;}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:var(--surface-2);color:var(--text-2);font-size:20px;flex:none;
  transition:background .15s,transform .1s;}
.iconbtn:active{transform:scale(.92);background:var(--surface-3);}

/* ---- Screen container ---- */
.screen{flex:1;padding:16px 16px 120px;display:none;animation:fade .22s ease;}
.screen.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---- Tab bar ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(13,15,18,.92);backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);border-top:1px solid var(--line-soft);
  display:flex;padding:8px 8px calc(var(--safe-b) + 8px);max-width:520px;margin:0 auto;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;
  color:var(--text-3);font-size:11px;font-weight:600;letter-spacing:.01em;transition:color .15s;}
.tab .ico{font-size:23px;line-height:1;}
.tab.active{color:var(--accent);}
.tab:active{transform:scale(.94);}

/* ---- Cards / lists ---- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:12px;}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--radius-sm);margin-bottom:8px;
  transition:background .12s,transform .08s;}
.row:active{background:var(--surface-2);transform:scale(.992);}
.row .main{flex:1;min-width:0;}
.row .name{font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .sub{font-size:12.5px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .ico{font-size:21px;flex:none;width:26px;text-align:center;}
.qtychip{flex:none;min-width:30px;height:26px;padding:0 9px;border-radius:8px;background:var(--accent-soft);
  color:var(--accent-text);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.chev{color:var(--text-3);font-size:18px;flex:none;}

.section-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);margin:18px 2px 9px;}
.empty{text-align:center;color:var(--text-3);padding:48px 20px;font-size:14.5px;}
.empty .big{font-size:40px;margin-bottom:12px;opacity:.5;}

/* ---- Tags ---- */
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--surface-3);
  color:var(--text-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px;}
.tag.sel{background:var(--accent-soft);color:var(--accent-text);border-color:transparent;}
.tag .x{font-size:13px;opacity:.7;}

/* ---- Form ---- */
label.fld{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--text-3);margin:0 2px 7px;}
.input{width:100%;height:var(--tap);background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:0 14px;color:var(--text);outline:none;transition:border .15s;}
.input:focus{border-color:var(--accent);}
textarea.input{height:auto;padding:12px 14px;line-height:1.4;resize:vertical;}
.field{margin-bottom:18px;}

.btn{width:100%;height:var(--tap);border-radius:var(--radius-sm);background:var(--accent);
  color:#1a1500;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .08s,opacity .15s;}
.btn:active{transform:scale(.985);}
.btn:disabled{opacity:.4;}
.btn.secondary{background:var(--surface-3);color:var(--text);}
.btn.danger{background:var(--red);color:#2a0d09;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text-2);}

/* ---- Type-ahead picker ---- */
.picker-wrap{position:relative;}
.suggest{position:absolute;left:0;right:0;top:calc(var(--tap) + 6px);z-index:20;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);
  max-height:230px;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,.45);}
.suggest .opt{padding:11px 14px;font-size:14.5px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:9px;}
.suggest .opt:last-child{border-bottom:none;}
.suggest .opt:active{background:var(--surface-3);}
.suggest .opt .path{font-size:11.5px;color:var(--text-3);margin-left:auto;max-width:45%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.suggest .head{padding:7px 14px 5px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--text-3);background:var(--surface);}

.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;}
.chip{padding:8px 13px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);
  font-size:13.5px;color:var(--text-2);font-weight:500;display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;max-width:100%;}
.chip .ico{font-size:15px;}
.chip:active{background:var(--surface-3);}

/* ---- Tree ---- */
.tree-node{}
.tree-row{display:flex;align-items:center;gap:8px;padding:11px 8px;border-radius:9px;
  transition:background .1s;}
.tree-row:active{background:var(--surface-2);}
.tw-toggle{width:24px;text-align:center;color:var(--text-3);font-size:13px;flex:none;
  transition:transform .18s;}
.tw-toggle.open{transform:rotate(90deg);}
.tw-ico{font-size:19px;flex:none;}
.tw-name{flex:1;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tw-count{font-size:11.5px;color:var(--text-3);background:var(--surface-2);padding:2px 8px;border-radius:10px;flex:none;}
.tw-badge{font-size:9.5px;font-weight:800;letter-spacing:.05em;color:var(--accent-text);
  background:var(--accent-soft);padding:2px 6px;border-radius:5px;flex:none;}
.tree-children{margin-left:14px;border-left:1px solid var(--line-soft);padding-left:4px;
  overflow:hidden;}

/* ---- Modal / sheet ---- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:none;
  align-items:flex-end;justify-content:center;animation:scrimIn .2s;}
.scrim.show{display:flex;}
@keyframes scrimIn{from{opacity:0;}to{opacity:1;}}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:22px 22px 0 0;
  border-top:1px solid var(--line);padding:10px 18px calc(var(--safe-b) + 22px);
  max-height:90vh;overflow-y:auto;animation:sheetIn .26s cubic-bezier(.2,.9,.3,1);}
@keyframes sheetIn{from{transform:translateY(100%);}to{transform:none;}}
.sheet .grab{width:38px;height:4.5px;border-radius:3px;background:var(--line);margin:4px auto 14px;}
.sheet h2{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em;}
.sheet .subtitle{font-size:13px;color:var(--text-3);margin:0 0 16px;}

/* ---- Stepper ---- */
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0;}
.stepbtn{width:60px;height:60px;border-radius:50%;background:var(--surface-3);font-size:30px;font-weight:300;
  display:flex;align-items:center;justify-content:center;color:var(--text);transition:transform .08s,background .12s;}
.stepbtn:active{transform:scale(.9);background:var(--accent-soft);color:var(--accent-text);}
.stepval{font-size:46px;font-weight:700;min-width:90px;text-align:center;font-variant-numeric:tabular-nums;}
.preview{text-align:center;font-size:15px;color:var(--text-2);margin:2px 0 18px;}
.preview b{color:var(--accent-text);}
.preview .arrow{color:var(--text-3);margin:0 8px;}

/* ---- Log ---- */
.logitem{display:flex;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line-soft);}
.logitem .dot{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:14px;background:var(--surface-3);}
.logitem .lmain{flex:1;min-width:0;}
.logitem .ltext{font-size:14px;line-height:1.35;}
.logitem .ltext b{font-weight:600;}
.logitem .ltime{font-size:11.5px;color:var(--text-3);margin-top:2px;}
.dot.add{background:rgba(108,192,139,.16);color:var(--green);}
.dot.move{background:rgba(91,155,213,.16);color:var(--blue);}
.dot.qty{background:rgba(224,164,74,.16);color:var(--amber);}
.dot.del{background:rgba(224,122,111,.16);color:var(--red);}
.dot.loc{background:var(--accent-soft);color:var(--accent-text);}

/* ---- misc ---- */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:13px;padding:0 14px;height:50px;margin-bottom:6px;}
.searchbar input{flex:1;background:none;border:none;outline:none;height:100%;}
.searchbar .si{font-size:19px;color:var(--text-3);}
.filterscroll{display:flex;gap:7px;overflow-x:auto;padding:10px 2px 4px;margin:0 -2px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;}
.filterscroll::-webkit-scrollbar{display:none;}
.detail-meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);margin-bottom:4px;}
.detail-path{font-size:13px;color:var(--text-3);margin-bottom:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.detail-path .seg{color:var(--text-2);}
.detail-path .sep{color:var(--text-3);opacity:.6;}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;}
.actions .btn{font-size:14.5px;}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translateX(-50%) translateY(20px);
  background:var(--surface-3);color:var(--text);padding:12px 20px;border-radius:24px;font-size:14px;font-weight:500;
  border:1px solid var(--line);z-index:120;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
  box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.seg-toggle{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:4px;gap:4px;margin-bottom:16px;}
.seg-toggle button{flex:1;height:38px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-3);transition:.15s;}
.seg-toggle button.on{background:var(--accent);color:#1a1500;}
.divider{height:1px;background:var(--line-soft);margin:16px 0;}
.linkrow{display:flex;align-items:center;gap:12px;padding:15px 14px;background:var(--surface);
  border:1px solid var(--line-soft);border-radius:var(--radius-sm);margin-bottom:8px;}
.linkrow .ico{font-size:20px;width:26px;text-align:center;color:var(--text-2);}
.linkrow .lt{flex:1;}
.linkrow .lt .t{font-size:15px;font-weight:500;}
.linkrow .lt .d{font-size:12.5px;color:var(--text-3);margin-top:1px;}
.graphwrap{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
  overflow:hidden;height:62vh;position:relative;}
.graphwrap svg{width:100%;height:100%;touch-action:none;display:block;}
.gnode-label{font-size:11px;font-weight:600;fill:var(--text);pointer-events:none;}
.hint{font-size:12.5px;color:var(--text-3);text-align:center;margin-top:8px;}
.mini-note{font-size:12.5px;color:var(--text-3);line-height:1.4;margin:6px 2px 0;}
</style>

<div class="app">
  <div class="topbar">
    <button class="iconbtn" id="backBtn" style="display:none" aria-label="Back">‹</button>
    <h1 id="title">Inventory</h1>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙</button>
  </div>

  <!-- ADD -->
  <div class="screen" id="screen-add"></div>
  <!-- SEARCH -->
  <div class="screen" id="screen-search"></div>
  <!-- MAP -->
  <div class="screen" id="screen-map"></div>
  <!-- LOG -->
  <div class="screen" id="screen-log"></div>
  <!-- SETTINGS (sub-screen) -->
  <div class="screen" id="screen-settings"></div>
  <!-- DETAIL (sub-screen) -->
  <div class="screen" id="screen-detail"></div>

  <div class="tabbar" id="tabbar">
    <button class="tab" data-tab="add"><span class="ico">＋</span>Add</button>
    <button class="tab" data-tab="search"><span class="ico">🔍</span>Search</button>
    <button class="tab" data-tab="map"><span class="ico">🗺</span>Map</button>
    <button class="tab" data-tab="log"><span class="ico">≡</span>Log</button>
  </div>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

/* ---------- persistence (IndexedDB, with localStorage fallback) ----------
   Storage layer is self-contained: works from any hosted URL or opened
   directly. IndexedDB is the primary store (durable, eviction-resistant for
   installed PWAs); localStorage is a mirror/fallback for resilience. */
const KEY = 'homeinv:data:v1';
const DB_NAME = 'homeinv', STORE = 'kv', DB_VER = 1;
let _db = null;

function openDB(){
  return new Promise((resolve)=>{
    if(_db) return resolve(_db);
    if(!('indexedDB' in window)) return resolve(null);
    let req;
    try{ req = indexedDB.open(DB_NAME, DB_VER); }
    catch(e){ return resolve(null); }
    req.onupgradeneeded = ()=>{ const db=req.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE); };
    req.onsuccess = ()=>{ _db=req.result; resolve(_db); };
    req.onerror  = ()=>{ resolve(null); };
  });
}
function idbGet(key){
  return new Promise((resolve)=>{ openDB().then(db=>{
    if(!db) return resolve(null);
    try{ const tx=db.transaction(STORE,'readonly').objectStore(STORE).get(key);
      tx.onsuccess=()=>resolve(tx.result ?? null); tx.onerror=()=>resolve(null);
    }catch(e){ resolve(null); }
  }); });
}
function idbSet(key,val){
  return new Promise((resolve)=>{ openDB().then(db=>{
    if(!db) return resolve(false);
    try{ const tx=db.transaction(STORE,'readwrite').objectStore(STORE).put(val,key);
      tx.onsuccess=()=>resolve(true); tx.onerror=()=>resolve(false);
    }catch(e){ resolve(false); }
  }); });
}

async function load(){
  let raw=null;
  try{ raw = await idbGet(KEY); }catch(e){}
  if(raw==null){ try{ raw = localStorage.getItem(KEY); }catch(e){} } // fallback / migrate
  if(raw){ try{ S=JSON.parse(raw); migrate(); return; }catch(e){} }
  // first run: seed
  S = JSON.parse(JSON.stringify(SEED));
  migrate();
  await persist();
}
let saveTimer=null;
async function persist(){
  const raw = JSON.stringify(S);
  let ok=false;
  try{ ok = await idbSet(KEY, raw); }catch(e){}
  try{ localStorage.setItem(KEY, raw); }catch(e){ /* quota / private mode */ }
  if(!ok){ try{ localStorage.getItem(KEY); ok=true; }catch(e){} }
  if(!ok){ toast('Heads up: storage unavailable — export a backup'); }
}

function migrate(){

}

function locPath(id, sep=' › '){
  const parts=[]; let cur=locById(id); let guard=0;
  while(cur && guard++<40){ parts.unshift(cur.name); cur=cur.parentId?locById(cur.parentId):null; }
  return parts.join(sep);
}
// descendants (locations) of a location, inclusive=false
function descendantLocs(id){
  const out=[]; const stack=[...childLocs(id)];
  while(stack.length){ const l=stack.pop(); out.push(l); stack.push(...childLocs(l.id)); }
  return out;
}
// every item physically inside this location or any descendant
function itemsWithin(id){
  const locIds=new Set([id, ...descendantLocs(id).map(l=>l.id)]);
  return S.items.filter(i=>!i.archived && locIds.has(i.locationId));
}

/* ---------- tagging (offline keyword dictionary) ---------- */
function autoTags(name){
  const lc = ' '+name.toLowerCase().replace(/[^a-z0-9\s-]/g,' ')+' ';
  const found=new Set();
  for(const kw in S.tagDict){
    const k=kw.toLowerCase();
    if(lc.includes(' '+k+' ') || lc.includes(' '+k) && lc.indexOf(k)>-1){
      // word-ish boundary check
      const re=new RegExp('(^|[^a-z0-9])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)');
      if(re.test(lc)) found.add(S.tagDict[kw]);
    }
  }
  return [...found];
}
// learn: associate the significant words of an item name with a manually-added tag
function learnTag(name, tag){
  const words = name.toLowerCase().replace(/[^a-z0-9\s-]/g,' ').split(/\s+/)
                    .filter(w=>w.length>=3 && !STOP.has(w));
  // attach the tag to the most distinctive word not already mapped
  for(const w of words){ if(!S.tagDict[w]){ S.tagDict[w]=tag; break; } }
  if(!S.tags.includes(tag)) S.tags.push(tag), S.tags.sort();
}
const STOP=new Set(['the','and','for','with','set','kit','box','bag','pack','new','old','home','inch','wall','under']);

/* ---------- fuzzy search (offline) ---------- */
function scoreMatch(item, q){
  if(!q) return 0;
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const name=item.name.toLowerCase();
  const tagStr=item.tags.join(' ').toLowerCase();
  const path=locPath(item.locationId).toLowerCase();
  let score=0;
  for(const t of terms){
    let hit=0;
    if(name.includes(t)) hit=Math.max(hit, name.startsWith(t)?3:2);
    if(tagStr.includes(t)) hit=Math.max(hit,2);
    if(path.includes(t)) hit=Math.max(hit,1);
    if(!hit){ // subsequence fuzzy on name
      if(isSubseq(t,name)) hit=0.5;
    }
    if(!hit) return -1; // every term must match somewhere
    score+=hit;
  }
  return score;
}
function isSubseq(q,s){ let i=0; for(const c of s){ if(c===q[i]) i++; if(i===q.length) return true; } return q.length===0; }

/* ---------- relative-time formatting ---------- */
function relTime(ts){
  const d=Date.now()-ts, m=60000,h=3600000,day=86400000;
  if(d<m) return 'just now';
  if(d<h) return Math.floor(d/m)+'m ago';
  if(d<day) return Math.floor(d/h)+'h ago';
  if(d<7*day) return Math.floor(d/day)+'d ago';
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function fullTime(ts){ return new Date(ts).toLocaleString(undefined,
  {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}); }

function toast(msg){

  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2100);

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

}
function showLocSuggest(q, targetId, onPick){
  const box=document.getElementById(targetId); if(!box) return;
  const ql=q.toLowerCase().trim();
  let locs=S.locations.filter(l=>!l.archived);
  if(ql){ locs=locs.filter(l=> l.name.toLowerCase().includes(ql) || locPath(l.id).toLowerCase().includes(ql)); }
  locs=locs.slice(0,40);
  if(!locs.length){ box.innerHTML='<div class="suggest"><div class="opt" style="color:var(--text-3)">No match</div></div>'; return; }
  box.innerHTML='<div class="suggest">'+locs.map(l=>{
    const parent=l.parentId?locPath(l.parentId):'';
    return `<div class="opt" data-id="${l.id}"><span>${locIcon(l)}</span><span>${esc(l.name)}</span><span class="path">${esc(parent)}</span></div>`;
  }).join('')+'</div>';
  box.querySelectorAll('.opt[data-id]').forEach(o=>o.onclick=()=>{ onPick(o.dataset.id); box.innerHTML=''; });
}
function saveNewItem(){
  const name=addState.name.trim();
  if(!name){ toast('Give the item a name'); document.getElementById('addName').focus(); return; }
  if(!addState.locId){ toast('Pick a location'); return; }
  const it={ id:uid('it'), name, qty:addState.qty, tags:[...new Set(addState.tags)],
             locationId:addState.locId, archived:false };
  S.items.push(it);
  logEvent({ type:'item_add', itemId:it.id, name:it.name, qty:it.qty, toLocationId:it.locationId });
  // ensure tags exist in master list
  it.tags.forEach(t=>{ if(!S.tags.includes(t)){ S.tags.push(t); } });
  S.tags.sort();
  ui.stickyLoc=addState.locId;
  queueSave();
  toast('Added “'+name+'”');
  // reset for next add, keep location sticky
  addState={ name:'', locId:addState.locId, tags:[], qty:1 };
  renderAdd();
}
</script>

<script>
/* =========================================================================
   SEARCH SCREEN
   ========================================================================= */
let searchState={ q:'', tag:null };
function renderSearch(){
  const el=document.getElementById('screen-search');
  el.innerHTML=`
    <div class="searchbar">
      <span class="si">🔍</span>
      <input id="searchInput" placeholder="Search items, tags, locations…" autocomplete="off" value="${esc(searchState.q)}" />
      ${searchState.q?'<button class="si" id="clearSearch" aria-label="Clear">✕</button>':''}
    </div>
    <div class="filterscroll" id="tagFilters"></div>
    <div id="searchResults"></div>
  `;
  // tag filters
  const tf=document.getElementById('tagFilters');
  const usedTags=[...new Set(S.items.filter(i=>!i.archived).flatMap(i=>i.tags))].sort();
  tf.innerHTML=usedTags.map(t=>`<button class="tag ${searchState.tag===t?'sel':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  tf.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{ searchState.tag=searchState.tag===b.dataset.t?null:b.dataset.t; renderSearch(); });

  const si=document.getElementById('searchInput');
  si.oninput=()=>{ searchState.q=si.value; renderResults(); };
  const cs=document.getElementById('clearSearch'); if(cs) cs.onclick=()=>{ searchState.q=''; renderSearch(); };
  renderResults();
  // keep focus convenience
}
function renderResults(){
  const box=document.getElementById('searchResults'); if(!box) return;
  let items=S.items.filter(i=>!i.archived);
  if(searchState.tag) items=items.filter(i=>i.tags.includes(searchState.tag));
  const q=searchState.q.trim();
  if(q){
    items=items.map(i=>({i,s:scoreMatch(i,q)})).filter(x=>x.s>=0)
               .sort((a,b)=>b.s-a.s).map(x=>x.i);
  } else {
    items=items.slice().sort((a,b)=>a.name.localeCompare(b.name));
  }
  if(!items.length){
    box.innerHTML=`<div class="empty"><div class="big">🔍</div>${q||searchState.tag?'No items match.':'Start typing to search your inventory.'}</div>`;
    return;
  }
  const header= q||searchState.tag ? `<div class="section-label">${items.length} result${items.length>1?'s':''}</div>`:`<div class="section-label">All items · ${items.length}</div>`;
  box.innerHTML=header+items.map(i=>itemRow(i)).join('');
  box.querySelectorAll('.row[data-item]').forEach(r=>r.onclick=()=>openItem(r.dataset.item));
}
function itemRow(i){
  const loc=locById(i.locationId);
  const qty = i.qty>1 ? `<span class="qtychip">${i.qty}</span>`:'';
  const tagbit = i.tags.length? ' · '+i.tags.slice(0,3).join(', ') : '';
  return `<div class="row" data-item="${i.id}">
    <div class="main"><div class="name">${esc(i.name)}</div>
      <div class="sub">${esc(loc?locPath(loc.id):'—')}${esc(tagbit)}</div></div>
    ${qty}<span class="chev">›</span></div>`;
}

/* =========================================================================
   MAP SCREEN  (tree default + graph toggle)
   ========================================================================= */
function renderMap(){
  const el=document.getElementById('screen-map');
  el.innerHTML=`
    <div class="seg-toggle">
      <button class="${ui.mapMode==='tree'?'on':''}" data-m="tree">Tree</button>
      <button class="${ui.mapMode==='graph'?'on':''}" data-m="graph">Graph</button>
    </div>
    <div id="mapBody"></div>
  `;
  el.querySelectorAll('.seg-toggle button').forEach(b=>b.onclick=()=>{ ui.mapMode=b.dataset.m; renderMap(); });
  if(ui.mapMode==='tree') renderTree(); else renderGraph();
}
function renderTree(){
  const body=document.getElementById('mapBody');
  const roots=S.locations.filter(l=>!l.parentId && !l.archived);
  body.innerHTML='<div style="margin-top:4px">'+roots.map(r=>treeNode(r,0)).join('')+'</div>'
    +'<p class="hint">Tap a location to view, move, or manage it.</p>';
  wireTree(body);
}
function treeNode(l, depth){
  const kids=childLocs(l.id);
  const directItems=itemsIn(l.id);
  const hasChildren = kids.length || directItems.length;
  const open = ui.treeOpen[l.id] ?? (depth<1);
  const total=locItemCount(l.id);
  const badge = l.movable? '<span class="tw-badge">MOVABLE</span>':'';
  let html=`<div class="tree-node">
    <div class="tree-row" data-loc="${l.id}">
      <span class="tw-toggle ${open?'open':''}" data-tog="${l.id}" style="${hasChildren?'':'visibility:hidden'}">▶</span>
      <span class="tw-ico">${locIcon(l)}</span>
      <span class="tw-name">${esc(l.name)}</span>
      ${badge}
      <span class="tw-count">${total}</span>
    </div>`;
  if(open && hasChildren){
    html+=`<div class="tree-children">`;
    html+=kids.map(k=>treeNode(k,depth+1)).join('');
    html+=directItems.map(it=>{
      const qty=it.qty>1?`<span class="qtychip">${it.qty}</span>`:'';
      return `<div class="tree-row" data-itemrow="${it.id}">
        <span class="tw-toggle" style="visibility:hidden">▶</span>
        <span class="tw-ico" style="font-size:15px;opacity:.7">•</span>
        <span class="tw-name" style="font-weight:400;color:var(--text-2)">${esc(it.name)}</span>${qty}</div>`;
    }).join('');
    html+=`</div>`;
  }
  html+=`</div>`;
  return html;
}
function wireTree(body){
  body.querySelectorAll('[data-tog]').forEach(t=>t.onclick=(e)=>{
    e.stopPropagation(); const id=t.dataset.tog;
    ui.treeOpen[id]=!(ui.treeOpen[id] ?? false);
    renderTree();
  });
  body.querySelectorAll('.tree-row[data-loc]').forEach(r=>r.onclick=(e)=>{
    if(e.target.dataset.tog) return;
    openLocation(r.dataset.loc);
  });
  body.querySelectorAll('[data-itemrow]').forEach(r=>r.onclick=()=>openItem(r.dataset.itemrow));
}

/* ---------- graph view (radial-ish force-free layout) ---------- */
function renderGraph(){
  const body=document.getElementById('mapBody');
  body.innerHTML=`<div class="graphwrap"><svg id="gsvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg></div>
    <p class="hint">Pinch / drag to explore · tap a node to open</p>`;
  const svg=document.getElementById('gsvg');
  // layout: simple tidy radial tree
  const roots=S.locations.filter(l=>!l.parentId && !l.archived);
  const nodes=[], links=[];
  const W=1000,H=1000;
  // assign positions via recursive angular partition
  let leafCounter=0;
  function countLeaves(l){ const k=childLocs(l.id); if(!k.length) return 1; return k.reduce((s,c)=>s+countLeaves(c),0); }
  const totalLeaves=roots.reduce((s,r)=>s+countLeaves(r),0)||1;
  let angleCursor=0;
  function place(l, depth, a0, a1){
    const mid=(a0+a1)/2;
    const radius=depth*135 + (depth?60:0);
    const cx=W/2+radius*Math.cos(mid-Math.PI/2);
    const cy=H/2+radius*Math.sin(mid-Math.PI/2);
    const node={id:l.id,x:depth?cx:W/2,y:depth?cy:H/2,depth,name:l.name,movable:l.movable,icon:locIcon(l),count:locItemCount(l.id)};
    nodes.push(node);
    const kids=childLocs(l.id);
    let span=a1-a0, cum=a0;
    kids.forEach(k=>{ const lv=countLeaves(k)/Math.max(1,countLeaves(l)); const ka1=cum+span*lv;
      const child=place(k,depth+1,cum,ka1); links.push([node,child]); cum=ka1; });
    return node;
  }
  let cum=0; roots.forEach(r=>{ const lv=countLeaves(r)/totalLeaves; place(r,0,cum*2*Math.PI,(cum+lv)*2*Math.PI); cum+=lv; });

  let svgInner='';
  links.forEach(([a,b])=>{ svgInner+=`<line x1="${a.x.toFixed(0)}" y1="${a.y.toFixed(0)}" x2="${b.x.toFixed(0)}" y2="${b.y.toFixed(0)}" stroke="#2a2f37" stroke-width="2"/>`; });
  nodes.forEach(n=>{
    const r = n.depth===0?34: n.movable?22:18;
    const fill = n.movable? '#3a3320' : '#1d2128';
    const stroke = n.movable? '#d4af37' : '#3a4250';
    svgInner+=`<g class="gnode" data-id="${n.id}" style="cursor:pointer">
      <circle cx="${n.x.toFixed(0)}" cy="${n.y.toFixed(0)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
      <text x="${n.x.toFixed(0)}" y="${(n.y+5).toFixed(0)}" text-anchor="middle" font-size="${n.depth===0?22:16}">${n.icon}</text>
      <text class="gnode-label" x="${n.x.toFixed(0)}" y="${(n.y+r+15).toFixed(0)}" text-anchor="middle">${esc(n.name.length>16?n.name.slice(0,15)+'…':n.name)}</text>
    </g>`;
  });
  svg.innerHTML=svgInner;
  svg.querySelectorAll('.gnode').forEach(g=>g.onclick=()=>openLocation(g.dataset.id));
  enablePanZoom(svg);
}
function enablePanZoom(svg){
  let vb={x:0,y:0,w:1000,h:1000};
  const set=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  let drag=null;
  svg.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove',e=>{ if(!drag) return;
    const sc=vb.w/svg.clientWidth; vb.x=drag.vx-(e.clientX-drag.x)*sc; vb.y=drag.vy-(e.clientY-drag.y)*sc; set(); });
  svg.addEventListener('pointerup',()=>drag=null);
  svg.addEventListener('pointercancel',()=>drag=null);
  let lastDist=null;
  svg.addEventListener('touchmove',e=>{
    if(e.touches.length===2){ e.preventDefault();
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      if(lastDist){ const f=lastDist/d; const nw=Math.min(2200,Math.max(280,vb.w*f)); const nh=nw;
        vb.x+=(vb.w-nw)/2; vb.y+=(vb.h-nh)/2; vb.w=nw; vb.h=nh; set(); }
      lastDist=d;
    }
  },{passive:false});
  svg.addEventListener('touchend',()=>lastDist=null);
}

/* =========================================================================
   LOG SCREEN  (global feed + filter)
   ========================================================================= */
let logFilter='';
function renderLog(){
  const el=document.getElementById('screen-log');
  el.innerHTML=`
    <div class="searchbar"><span class="si">≡</span>
      <input id="logSearch" placeholder="Filter history…" autocomplete="off" value="${esc(logFilter)}"/>
      ${logFilter?'<button class="si" id="logClear">✕</button>':''}
    </div>
    <div id="logBody"></div>`;
  const ls=document.getElementById('logSearch');
  ls.oninput=()=>{ logFilter=ls.value; renderLogBody(); };
  const lc=document.getElementById('logClear'); if(lc) lc.onclick=()=>{logFilter='';renderLog();};
  renderLogBody();
}
function logLine(e){
  const it=e.itemId?itemById(e.itemId):null;
  const itName=e.name|| (it?it.name:'item');
  const toL=e.toLocationId?locById(e.toLocationId):null;
  const frL=e.fromLocationId?locById(e.fromLocationId):null;
  let cls='add',ico='＋',text='';
  switch(e.type){
    case 'item_add': cls='add';ico='＋'; text=`Added <b>${esc(itName)}</b>${e.qty>1?` ×${e.qty}`:''} to ${esc(toL?locPath(toL.id):'?')}`; break;
    case 'item_move': cls='move';ico='→'; text=`Moved <b>${esc(itName)}</b> ${frL?'from '+esc(frL.name)+' ':''}to ${esc(toL?locPath(toL.id):'?')}`; break;
    case 'item_remove': cls='del';ico='🗑'; text=`Removed <b>${esc(itName)}</b>`; break;
    case 'item_restore': cls='add';ico='↩'; text=`Restored <b>${esc(itName)}</b> to ${esc(toL?locPath(toL.id):'?')}`; break;
    case 'qty_change': { const d=e.delta; cls='qty';ico=d>0?'▲':'▼';
      text=`<b>${esc(itName)}</b> ${e.from} → ${e.to} (${d>0?'+':''}${d})`; break; }
    case 'location_create': cls='loc';ico='📁'; text=`Created location <b>${esc(e.name||(locById(e.locationId)||{}).name||'?')}</b>`; break;
    case 'location_move': { const ml=locById(e.locationId); cls='move';ico='⇄';
      text=`Moved <b>${esc(e.name||(ml?ml.name:'location'))}</b> to ${esc(toL?locPath(toL.id):'?')}`; break; }
    case 'location_remove': cls='del';ico='🗑'; text=`Removed location <b>${esc(e.name||(locById(e.locationId)||{}).name||'?')}</b>`; break;
    case 'location_restore': cls='loc';ico='↩'; text=`Restored location <b>${esc(e.name||(locById(e.locationId)||{}).name||'?')}</b>`; break;
    default: text=esc(e.type);
  }
  return {cls,ico,text};
}
function renderLogBody(){
  const box=document.getElementById('logBody'); if(!box) return;
  let evs=S.log.slice().reverse();
  const f=logFilter.toLowerCase().trim();
  if(f){ evs=evs.filter(e=>{ const l=logLine(e); return l.text.toLowerCase().includes(f) ||
        (e.name||'').toLowerCase().includes(f); }); }
  if(!evs.length){ box.innerHTML=`<div class="empty"><div class="big">≡</div>${f?'No matching history.':'No history yet.'}</div>`; return; }
  // group by day
  let html=''; let lastDay='';
  evs.forEach(e=>{
    const day=new Date(e.ts).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
    if(day!==lastDay){ html+=`<div class="section-label">${day}</div>`; lastDay=day; }
    const l=logLine(e);
    html+=`<div class="logitem"><div class="dot ${l.cls}">${l.ico}</div>
      <div class="lmain"><div class="ltext">${l.text}</div><div class="ltime">${fullTime(e.ts)}</div></div></div>`;
  });
  box.innerHTML=html;
}
</script>

<script>
/* =========================================================================
   DETAIL: ITEM
   ========================================================================= */
function openItem(id){ ui.detailItemId=id; ui.detailLocId=null; ui.detailFrom=ui.tab; show('detail'); }
function openLocation(id){ ui.detailLocId=id; ui.detailItemId=null; ui.detailFrom=ui.tab; show('detail'); }

function renderDetail(){
  if(ui.detailItemId) renderItemDetail();
  else if(ui.detailLocId) renderLocDetail();
}
function renderItemDetail(){
  const it=itemById(ui.detailItemId);
  const el=document.getElementById('screen-detail');
  if(!it){ el.innerHTML='<div class="empty">Item not found.</div>'; return; }
  const loc=locById(it.locationId);
  const myLog=S.log.filter(e=>e.itemId===it.id).reverse();
  el.innerHTML=`
    <div class="card">
      <div class="detail-meta">
        ${it.qty>1?`<span class="qtychip">${it.qty}</span>`:''}
        <span>${it.qty>1?it.qty+' in stock':'1 in stock'}</span>
      </div>
      <div class="detail-path">${pathChips(it.locationId)}</div>
      <div class="tags" id="itemTags"></div>
      <input class="input" id="itemTagAdd" placeholder="+ add a tag" autocomplete="off" style="margin-top:11px;height:42px;" />
    </div>

    <div class="actions">
      <button class="btn secondary" id="btnQty">Adjust quantity</button>
      <button class="btn secondary" id="btnMove">Move</button>
    </div>
    <button class="btn ghost" id="btnRename" style="margin-bottom:10px;">Rename</button>
    <button class="btn ghost danger-text" id="btnRemove" style="color:var(--red);border-color:var(--red);">Remove item</button>

    <div class="section-label">Item history</div>
    <div id="itemHist"></div>
  `;
  renderItemTags(it);
  document.getElementById('itemTagAdd').onkeydown=(e)=>{ if(e.key==='Enter'){ const v=e.target.value.trim().toLowerCase();
    if(v && !it.tags.includes(v)){ it.tags.push(v); learnTag(it.name,v); queueSave(); e.target.value=''; renderItemTags(it); } } };
  document.getElementById('btnQty').onclick=()=>openQtySheet(it.id);
  document.getElementById('btnMove').onclick=()=>openMoveSheet({itemId:it.id});
  document.getElementById('btnRename').onclick=()=>openRenameSheet({itemId:it.id});
  document.getElementById('btnRemove').onclick=()=>openRemoveSheet({itemId:it.id});
  const hist=document.getElementById('itemHist');
  hist.innerHTML = myLog.length? myLog.map(e=>{ const l=logLine(e);
    return `<div class="logitem"><div class="dot ${l.cls}">${l.ico}</div><div class="lmain"><div class="ltext">${l.text}</div><div class="ltime">${fullTime(e.ts)}</div></div></div>`;
  }).join('') : '<p class="mini-note">No history yet.</p>';
}
function renderItemTags(it){
  const box=document.getElementById('itemTags'); if(!box) return;
  box.innerHTML = it.tags.length? it.tags.map(t=>`<span class="tag sel" data-t="${esc(t)}">${esc(t)} <span class="x">×</span></span>`).join('')
                : '<span class="mini-note" style="margin:0">No tags</span>';
  box.querySelectorAll('.tag').forEach(tg=>tg.onclick=()=>{ it.tags=it.tags.filter(x=>x!==tg.dataset.t); queueSave(); renderItemTags(it); });
}
function pathChips(locId){
  const parts=[]; let cur=locById(locId); let guard=0;
  while(cur && guard++<40){ parts.unshift(cur); cur=cur.parentId?locById(cur.parentId):null; }
  return parts.map((p,i)=>`${i?'<span class="sep">›</span>':''}<span class="seg" data-loc="${p.id}">${locIcon(p)} ${esc(p.name)}</span>`).join(' ');
}

/* =========================================================================
   DETAIL: LOCATION
   ========================================================================= */
function renderLocDetail(){
  const l=locById(ui.detailLocId);
  const el=document.getElementById('screen-detail');
  if(!l){ el.innerHTML='<div class="empty">Location not found.</div>'; return; }
  const kids=childLocs(l.id);
  const directItems=itemsIn(l.id);
  const within=itemsWithin(l.id).length;
  const myLog=S.log.filter(e=> e.locationId===l.id || (e.toLocationId===l.id) || (e.fromLocationId===l.id) ||
                 (e.itemId && itemById(e.itemId) && itemById(e.itemId).locationId===l.id)).reverse().slice(0,60);
  const t=typeById(l.typeId);
  el.innerHTML=`
    <div class="card">
      <div class="detail-meta">
        <span style="font-size:22px">${locIcon(l)}</span>
        <span>${t?esc(t.name):'Location'}</span>
        ${l.movable?'<span class="tw-badge">MOVABLE</span>':'<span class="tag" style="font-size:10.5px">Fixed</span>'}
      </div>
      <div class="detail-path">${l.parentId?pathChips(l.parentId):'<span class="seg">Top level</span>'}</div>
      <div class="mini-note" style="margin:0">${within} item${within!==1?'s':''} inside (incl. sub-locations)</div>
    </div>

    <div class="actions">
      <button class="btn secondary" id="btnAddHere">Add item here</button>
      ${l.movable?'<button class="btn secondary" id="btnMoveLoc">Move location</button>':'<button class="btn secondary" id="btnAddSub">Add sub-location</button>'}
    </div>
    ${l.movable?'<button class="btn ghost" id="btnAddSub2" style="margin-bottom:10px;">Add sub-location</button>':''}
    <button class="btn ghost" id="btnRenameLoc" style="margin-bottom:10px;">Rename / change type</button>
    ${l.parentId!==undefined?`<button class="btn ghost" id="btnRemoveLoc" style="color:var(--red);border-color:var(--red);">Remove location</button>`:''}

    ${kids.length?`<div class="section-label">Sub-locations</div>${kids.map(k=>{
        const cnt=locItemCount(k.id);
        return `<div class="row" data-loc="${k.id}"><span class="ico">${locIcon(k)}</span>
          <div class="main"><div class="name">${esc(k.name)}</div><div class="sub">${cnt} item${cnt!==1?'s':''}${k.movable?' · movable':''}</div></div>
          <span class="chev">›</span></div>`;}).join('')}`:''}

    ${directItems.length?`<div class="section-label">Items here</div>${directItems.map(itemRow).join('')}`:''}
    ${(!kids.length&&!directItems.length)?'<div class="empty" style="padding:30px"><div class="big">📭</div>Empty location</div>':''}

    <div class="section-label">Location history</div>
    <div id="locHist"></div>
  `;
  el.querySelector('#btnAddHere').onclick=()=>{ addState={name:'',locId:l.id,tags:[],qty:1}; ui.stickyLoc=l.id; show('add'); };
  const mv=el.querySelector('#btnMoveLoc'); if(mv) mv.onclick=()=>openMoveSheet({locId:l.id});
  const as=el.querySelector('#btnAddSub')||el.querySelector('#btnAddSub2'); if(as) as.onclick=()=>openNewLocSheet(l.id);
  el.querySelector('#btnRenameLoc').onclick=()=>openRenameSheet({locId:l.id});
  const rl=el.querySelector('#btnRemoveLoc'); if(rl) rl.onclick=()=>openRemoveSheet({locId:l.id});
  el.querySelectorAll('.row[data-loc]').forEach(r=>r.onclick=()=>openLocation(r.dataset.loc));
  el.querySelectorAll('.row[data-item]').forEach(r=>r.onclick=()=>openItem(r.dataset.item));
  el.querySelectorAll('.seg[data-loc]').forEach(s=>s.onclick=()=>openLocation(s.dataset.loc));
  const lh=document.getElementById('locHist');
  lh.innerHTML=myLog.length?myLog.map(e=>{const ln=logLine(e);

  document.getElementById('screen-detail').querySelectorAll('.seg[data-loc]').forEach(s=>s.onclick=()=>openLocation(s.dataset.loc));

/* ---------- quantity ---------- */
function openQtySheet(itemId){
  const it=itemById(itemId); if(!it) return;
  let working=it.qty;
  openSheet(`
    <h2>Adjust quantity</h2>
    <p class="subtitle">${esc(it.name)}</p>
    <div class="stepper"><button class="stepbtn" id="qm">−</button>
      <div class="stepval" id="qv">${working}</div>
      <button class="stepbtn" id="qp">＋</button></div>
    <div class="preview" id="qprev">No change</div>
    <button class="btn" id="qConfirm">Confirm</button>
    <button class="btn ghost" id="qCancel" style="margin-top:10px;">Cancel</button>
  `);
  const upd=()=>{ document.getElementById('qv').textContent=working;
    const d=working-it.qty;
    document.getElementById('qprev').innerHTML = d===0?'No change':
      `<b>${it.qty}</b><span class="arrow">→</span><b>${working}</b> &nbsp;(${d>0?'+':''}${d})`;
    document.getElementById('qConfirm').disabled = d===0;
  };
  document.getElementById('qm').onclick=()=>{ working=Math.max(0,working-1); upd(); };
  document.getElementById('qp').onclick=()=>{ working++; upd(); };
  document.getElementById('qCancel').onclick=closeSheet;
  document.getElementById('qConfirm').onclick=()=>{
    const d=working-it.qty; if(d===0) return closeSheet();
    const from=it.qty; it.qty=working;
    logEvent({type:'qty_change',itemId:it.id,name:it.name,from,to:working,delta:d});
    if(working===0){ toast('Quantity is 0 — item kept. Remove it from the item screen if gone.'); }
    queueSave(); closeSheet(); render();
  };
  upd();
}

/* ---------- move ---------- */
function openMoveSheet({itemId,locId}){
  const subject = itemId? itemById(itemId) : locById(locId);
  if(!subject) return;
  const isItem=!!itemId;
  // build excluded set for locations (can't move into self/descendants)
  let excluded=new Set();
  if(!isItem){ excluded=new Set([locId, ...descendantLocs(locId).map(l=>l.id)]); }
  openSheet(`
    <h2>Move ${isItem?'item':'location'}</h2>
    <p class="subtitle">${esc(subject.name)} — pick a new home</p>
    <div class="picker-wrap">
      <input class="input" id="moveInput" placeholder="Search destination…" autocomplete="off"/>
      <div id="moveSuggest"></div>
    </div>
    <div class="chiprow" id="moveRecents" style="margin-top:12px"></div>
  `);
  const recents=document.getElementById('moveRecents');
  recents.innerHTML=recentLocIds(6).filter(id=>!excluded.has(id)).map(id=>{const l=locById(id);
    return l?`<button class="chip" data-id="${id}"><span class="ico">${locIcon(l)}</span>${esc(l.name)}</button>`:''; }).join('');
  recents.querySelectorAll('.chip').forEach(c=>c.onclick=()=>doMove(c.dataset.id));
  const mi=document.getElementById('moveInput');
  const pick=(id)=>{ if(excluded.has(id)){ toast("Can't move into itself"); return; } doMove(id); };
  mi.oninput=()=>showLocSuggestFiltered(mi.value,'moveSuggest',pick,excluded);
  mi.onfocus=()=>showLocSuggestFiltered(mi.value,'moveSuggest',pick,excluded);
  setTimeout(()=>mi.focus(),250);

  function doMove(destId){
    if(isItem){
      const it=subject; const from=it.locationId; if(from===destId){ closeSheet(); toast('Already there'); return; }
      it.locationId=destId;
      logEvent({type:'item_move',itemId:it.id,name:it.name,fromLocationId:from,toLocationId:destId});
    } else {
      const l=subject; const from=l.parentId; if(from===destId){ closeSheet(); toast('Already there'); return; }
      l.parentId=destId;
      logEvent({type:'location_move',locationId:l.id,name:l.name,fromLocationId:from,toLocationId:destId});
      // cascade: log a move entry for every item physically within (audit requirement)
      itemsWithin(l.id).forEach(it=>{
        logEvent({type:'item_move',itemId:it.id,name:it.name,fromLocationId:it.locationId,toLocationId:it.locationId,
                  viaLocation:l.id, cascade:true});
      });
    }
    ui.stickyLoc=destId; queueSave(); closeSheet(); render();
    toast('Moved to '+locById(destId).name);
  }
}
function showLocSuggestFiltered(q,target,onPick,excluded){
  const box=document.getElementById(target); if(!box) return;
  const ql=q.toLowerCase().trim();
  let locs=S.locations.filter(l=>!l.archived && !excluded.has(l.id));
  if(ql) locs=locs.filter(l=>l.name.toLowerCase().includes(ql)||locPath(l.id).toLowerCase().includes(ql));
  locs=locs.slice(0,40);
  box.innerHTML='<div class="suggest">'+(locs.length?locs.map(l=>{
    const parent=l.parentId?locPath(l.parentId):'Top level';
    return `<div class="opt" data-id="${l.id}"><span>${locIcon(l)}</span><span>${esc(l.name)}</span><span class="path">${esc(parent)}</span></div>`;
  }).join(''):'<div class="opt" style="color:var(--text-3)">No match</div>')+'</div>';
  box.querySelectorAll('.opt[data-id]').forEach(o=>o.onclick=()=>onPick(o.dataset.id));
}

/* ---------- remove (soft delete) ---------- */
function openRemoveSheet({itemId,locId}){
  if(itemId){ const it=itemById(itemId);
    openSheet(`<h2>Remove item?</h2><p class="subtitle">${esc(it.name)} will move to the archive. You can restore it later.</p>
      <button class="btn danger" id="rmYes">Remove “${esc(it.name)}”</button>
      <button class="btn ghost" id="rmNo" style="margin-top:10px">Cancel</button>`);
    document.getElementById('rmNo').onclick=closeSheet;
    document.getElementById('rmYes').onclick=()=>{ it.archived=true; it._lastLoc=it.locationId;
      logEvent({type:'item_remove',itemId:it.id,name:it.name,fromLocationId:it.locationId}); queueSave();
      closeSheet(); toast('Archived'); show(ui.detailFrom||'search'); };
  } else { const l=locById(locId);
    const within=itemsWithin(l.id); const subs=descendantLocs(l.id);
    const hasContents=within.length||subs.length;
    openSheet(`<h2>Remove location?</h2><p class="subtitle">${esc(l.name)}${hasContents?` contains ${within.length} item${within.length!==1?'s':''}`+(subs.length?` and ${subs.length} sub-location${subs.length!==1?'s':''}`:'')+'.':''}</p>
      ${hasContents?`<div class="field"><label class="fld">What about the contents?</label>
        <div class="seg-toggle" style="margin:0"><button id="spillUp" class="on">Move up to parent</button><button id="archAll">Archive everything</button></div>
        <p class="mini-note" id="spillNote">Contents move to ${l.parentId?esc(locById(l.parentId).name):'top level'}.</p></div>`:''}
      <button class="btn danger" id="rmYes">Remove “${esc(l.name)}”</button>
      <button class="btn ghost" id="rmNo" style="margin-top:10px">Cancel</button>`);
    let mode='spill';
    if(hasContents){ document.getElementById('spillUp').onclick=()=>{mode='spill';document.getElementById('spillUp').classList.add('on');document.getElementById('archAll').classList.remove('on');document.getElementById('spillNote').textContent='Contents move to '+(l.parentId?locById(l.parentId).name:'top level')+'.';};
      document.getElementById('archAll').onclick=()=>{mode='archive';document.getElementById('archAll').classList.add('on');document.getElementById('spillUp').classList.remove('on');document.getElementById('spillNote').textContent='All items and sub-locations are archived too.';}; }
    document.getElementById('rmNo').onclick=closeSheet;
    document.getElementById('rmYes').onclick=()=>{
      if(hasContents && mode==='spill'){
        const dest=l.parentId;
        itemsIn(l.id).forEach(it=>{ const from=it.locationId; it.locationId=dest||it.locationId;
          if(dest) logEvent({type:'item_move',itemId:it.id,name:it.name,fromLocationId:from,toLocationId:dest}); });
        childLocs(l.id).forEach(c=>{ const from=c.parentId; c.parentId=dest;
          logEvent({type:'location_move',locationId:c.id,name:c.name,fromLocationId:from,toLocationId:dest}); });
      } else if(hasContents && mode==='archive'){
        itemsWithin(l.id).forEach(it=>{ it.archived=true; logEvent({type:'item_remove',itemId:it.id,name:it.name,fromLocationId:it.locationId}); });
        descendantLocs(l.id).forEach(c=>{ c.archived=true; logEvent({type:'location_remove',locationId:c.id,name:c.name}); });
      }
      l.archived=true; logEvent({type:'location_remove',locationId:l.id,name:l.name});
      queueSave(); closeSheet(); toast('Location archived'); show('map');
    };
  }
}

function renderTagsView(el){
  const counts={}; S.items.filter(i=>!i.archived).forEach(i=>i.tags.forEach(t=>counts[t]=(counts[t]||0)+1));
  const tags=[...new Set([...S.tags,...Object.keys(counts)])].sort();
  el.innerHTML=`<div class="section-label">Tags · ${tags.length}</div>
    ${tags.map(t=>`<div class="row"><div class="main"><div class="name">${esc(t)}</div><div class="sub">${counts[t]||0} item${(counts[t]||0)!==1?'s':''}</div></div>
      <button class="iconbtn" style="width:38px;height:38px;font-size:16px" data-rt="${esc(t)}">✎</button></div>`).join('')}
    <p class="mini-note">Renaming a tag updates it across all items.</p>`;
  el.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>{
    const old=b.dataset.rt;
    openSheet(`<h2>Rename tag</h2><div class="field" style="margin-top:8px"><input class="input" id="rtIn" value="${esc(old)}"/></div>
      <button class="btn" id="rtSave">Save</button><button class="btn ghost" id="rtCancel" style="margin-top:10px">Cancel</button>`);
    document.getElementById('rtCancel').onclick=closeSheet;
    document.getElementById('rtSave').onclick=()=>{ const nv=document.getElementById('rtIn').value.trim().toLowerCase();
      if(nv&&nv!==old){ S.items.forEach(i=>{ i.tags=i.tags.map(x=>x===old?nv:x); i.tags=[...new Set(i.tags)]; });
        S.tags=[...new Set(S.tags.map(x=>x===old?nv:x))].sort();
        for(const k in S.tagDict) if(S.tagDict[k]===old) S.tagDict[k]=nv; queueSave(); }
      closeSheet(); renderSettings(); };
  });
}
function renderArchiveView(el){
  const ai=S.items.filter(i=>i.archived); const al=S.locations.filter(l=>l.archived);

    S.items=S.items.filter(i=>i.id!==b.dataset.hi); queueSave(); renderSettings(); });

    S.locations=S.locations.filter(l=>l.id!==b.dataset.hl); queueSave(); renderSettings(); });
}

/* ---------- export / import ---------- */
function doExport(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='home-inventory-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function handleImport(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result);
    if(!data.items||!data.locations) throw new Error('bad');
    openSheet(`<h2>Import backup?</h2><p class="subtitle">Found ${data.items.length} items and ${data.locations.length} locations.</p>
      <button class="btn danger" id="impReplace">Replace everything</button>
      <button class="btn secondary" id="impMerge" style="margin-top:10px">Merge into current</button>
      <button class="btn ghost" id="impCancel" style="margin-top:10px">Cancel</button>`);
    document.getElementById('impCancel').onclick=closeSheet;
    document.getElementById('impReplace').onclick=()=>{ S=data; migrate(); persist(); closeSheet(); toast('Restored'); show('map'); };
    document.getElementById('impMerge').onclick=()=>{ mergeData(data); persist(); closeSheet(); toast('Merged'); show('map'); };
  }catch(err){ toast('Invalid backup file'); } };
  r.readAsText(f); e.target.value='';
}
function mergeData(d){
  const has=(arr,id)=>arr.some(x=>x.id===id);
  (d.types||[]).forEach(t=>{ if(!has(S.types,t.id)) S.types.push(t); });
  (d.locations||[]).forEach(l=>{ if(!has(S.locations,l.id)) S.locations.push(l); });
  (d.items||[]).forEach(i=>{ if(!has(S.items,i.id)) S.items.push(i); });
  (d.log||[]).forEach(e=>{ if(!has(S.log,e.id)) S.log.push(e); });
  S.log.sort((a,b)=>a.ts-b.ts);
  (d.tags||[]).forEach(t=>{ if(!S.tags.includes(t)) S.tags.push(t); }); S.tags.sort();
  Object.assign(S.tagDict, d.tagDict||{});
}

  await load();
